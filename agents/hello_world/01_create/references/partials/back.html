<div class="card back">
  <div class="corner-mark tl" aria-hidden="true"></div>
  <div class="corner-mark br" aria-hidden="true"></div>

  <div class="brand-row">
    <span class="dot"></span>
    <span class="wordmark">{{business_name}}</span>
  </div>

  <div class="tagline">Real Outcomes. Real ROI. Real Results.</div>
  <div class="back-values">Via Sustainable Accessible and Transparent AI.</div>

  <div class="qr-wrap">
    <div class="qr-box">
      <img src="images/qr-code.jpg" alt="QR code linking to {{qr_destination}}">
    </div>
    <div class="qr-label">
      <div class="url">Scan for Contact Info</div>
    </div>
  </div>
</div>
