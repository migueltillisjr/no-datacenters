<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Info Pioneer - Business Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap');

:root {
  --teal: #0F766E;
  --teal-dark: #0B5A54;
  --ink: #1B1B1B;
  --muted: #5A5953;
  --cream: #F1EFE9;
  --cream-soft: #E8E5DC;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #d9d6cd;
  font-family: 'Sora', 'Trebuchet MS', sans-serif;
}

body {
  padding: 48px;
  display: flex;
  flex-wrap: wrap;
  gap: 40px;
  align-items: flex-start;
}

.card {
  width: 3.5in;
  height: 2in;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.10);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--teal);
  flex-shrink: 0;
}

.wordmark {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--ink);
  text-transform: uppercase;
}

.print-note {
  width: 100%;
  font-family: 'Sora', sans-serif;
  color: #4a4a4a;
  font-size: 13px;
  margin-bottom: 4px;
}

.front {
  background: var(--cream);
  padding: 0.24in 0.28in;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  justify-content: space-between;
  gap: 0.14in;
}

.front-main {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex: 0 0 50%;
  min-width: 0;
}

.front-photo {
  position: absolute;
  top: -0.08in;
  right: -0.08in;
  bottom: -0.08in;
  width: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-frame {
  width: 100%;
  height: 100%;
  border-radius: 50% 20px 20px 50%;
  border: 12px solid var(--cream);
  background: var(--cream-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.photo-frame .initials {
  display: none;
  font-size: 20px;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.5px;
}

.name-block { margin-top: 4px; }

.name {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.2px;
  line-height: 1.1;
  white-space: nowrap;
}

.title {
  margin-top: 3px;
  font-size: 8px;
  font-weight: 600;
  color: var(--teal);
  letter-spacing: 0.2px;
  text-transform: uppercase;
  white-space: nowrap;
}

.front-tagline {
  margin-top: 6px;
  font-size: 7.2px;
  font-weight: 700;
  color: #000;
  line-height: 1.4;
  white-space: nowrap;
}

.rule {
  height: 1px;
  background: var(--cream-soft);
  width: 100%;
}

.contact {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.contact-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
  font-weight: 500;
}

.contact-row .icon {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  color: var(--teal);
}

.contact-row .val {
  color: var(--ink);
  font-weight: 600;
}

.back {
  background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dark) 100%);
  padding: 0.28in 0.3in;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  position: relative;
}

.back .brand-row { justify-content: center; }
.back .dot { background: var(--cream); }
.back .wordmark {
  color: var(--cream);
  font-size: 13px;
  letter-spacing: 1.5px;
}

.tagline {
  color: rgba(241,239,233,0.88);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.4px;
  max-width: 2.6in;
  line-height: 1.5;
}

.back-values {
  color: var(--cream);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.3px;
  max-width: 2.6in;
  line-height: 1.4;
  text-align: center;
}

.qr-wrap {
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.qr-box {
  width: 0.78in;
  height: 0.78in;
  background: rgba(241,239,233,0.10);
  border: 1px solid rgba(241,239,233,0.35);
  border-radius: 6px;
  padding: 4px;
}

.qr-box img {
  width: 100%;
  height: 100%;
  display: block;
}

.qr-label {
  text-align: left;
  color: var(--cream);
  font-size: 8.5px;
  line-height: 1.5;
}

.qr-label .url {
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.2px;
}

.corner-mark {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: rgba(241,239,233,0.06);
}

.corner-mark.tl { top: -35px; left: -35px; }
.corner-mark.br { bottom: -40px; right: -40px; }

@media print {
  @page { size: 3.75in 2.25in; margin: 0; }

  html, body {
    width: 3.75in;
    min-height: 2.25in;
    background: white;
    padding: 0;
    margin: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .print-note { display: none; }

  .card {
    width: 3.5in;
    height: 2in;
    position: relative;
    overflow: visible;
    isolation: isolate;
    box-shadow: none;
    border-radius: 0;
    page-break-after: always;
    break-after: page;
    margin: 0.125in;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: -0.125in;
    z-index: -1;
    pointer-events: none;
  }

  .front::after { background: var(--cream); }
  .back::after { background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dark) 100%); }

  .card:last-of-type {
    page-break-after: auto;
    break-after: auto;
  }

  body { display: block; gap: 0; padding: 0; }
}
</style>
</head>
<body>
<div class="card front">
  <div class="front-main">
    <div class="brand-row">
      <span class="dot"></span>
      <span class="wordmark">Info Pioneer</span>
    </div>

    <div class="name-block">
      <div class="name">Miguel Tillis Jr.</div>
      <div class="title">TECH CONSULTANT · FOUNDER</div>
      <div class="front-tagline">Real Outcomes. Real ROI. Real Results.</div>
    </div>

    <div class="rule"></div>

    <div class="contact">
      <div class="contact-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/></svg>
        <span class="val">619-704-5891</span>
      </div>
      <div class="contact-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 6l-10 7L2 6"/><path d="M2 6h20v12H2z"/></svg>
        <span class="val">miguel@infopioneer.ai</span>
      </div>
      <div class="contact-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="val">infopnr.com</span>
      </div>
    </div>
  </div>

  <div class="front-photo">
    <div class="photo-frame">
      <img src="images/headshot_pic.jpg" alt="Miguel Tillis Jr." onerror="this.hidden=true; this.nextElementSibling.style.display='block'">
      <span class="initials" aria-hidden="true">MT</span>
    </div>
  </div>
</div>

<div class="card back">
  <div class="corner-mark tl" aria-hidden="true"></div>
  <div class="corner-mark br" aria-hidden="true"></div>

  <div class="brand-row">
    <span class="dot"></span>
    <span class="wordmark">Info Pioneer</span>
  </div>

  <div class="tagline">Real Outcomes. Real ROI. Real Results.</div>
  <div class="back-values">Via Sustainable Accessible and Transparent AI.</div>

  <div class="qr-wrap">
    <div class="qr-box">
      <img src="images/qr-code.jpg" alt="QR code linking to https://miguel-tillis.miguel-b8f.workers.dev">
    </div>
    <div class="qr-label">
      <div class="url">Scan for Contact Info</div>
    </div>
  </div>
</div>
</body>
</html>
